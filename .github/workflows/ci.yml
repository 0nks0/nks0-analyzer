name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      # The site ships exactly as committed, so a stale ?v= means returning
      # visitors keep old assets. This has shipped broken twice: results.html
      # was once pinned to v1.3.5 against a v1.4.0 app, with an unversioned
      # stylesheet. Exits non-zero if APP_VERSION and any asset ?v= disagree.
      - name: Check asset version consistency
        run: npm run check-version

      # Runs tests/index.html headlessly in jsdom. The suite itself stays
      # dependency-free so it can also just be opened in a browser.
      - name: Run tests
        run: npm test
